language: en # en | ru

settings:
  beginCountdownSeconds: 5
  endGameLobbyCountdownSeconds: 5
  endGameSpectatorDelayTicks: 40
  arenaResetDelayTicks: 160
  borderShrinkSeconds: 360
  borderMinSize: 1
  borderSpawnPaddingBlocks: 10
  spawnPillarHeightBlocks: 5
  lobbyWorldName: "lobby"
  gameEvents:
    enabled: true
    minimumDelaySeconds: 30
    maximumDelaySeconds: 60
    antiRepeatHistorySize: 2
    superSmashBros:
      durationSeconds: 20
      knockbackMultiplier: 2.5
    cosmicDrift:
      durationSeconds: 25
      gravityMultiplier: 0.35
      jumpStrengthMultiplier: 1.3
      fallDamageMultiplier: 0.25
    meteorShower:
      durationSeconds: 24
      wavePeriodTicks: 60
      warningTicks: 30
      maxMeteorsPerWave: 3
      playersPerMeteor: 4
      impactRadius: 3.5
      maxDamage: 6.0
      knockbackStrength: 1.15
      spawnHeight: 16.0
      randomOffsetRadius: 3.0
    earthquake:
      durationSeconds: 24
      wavePeriodTicks: 60
      warningTicks: 30
      missingDurationTicks: 60
      maxBlocksPerWave: 4
      playersPerBlock: 3
      horizontalSearchRadius: 3
    huntBegins:
      durationSeconds: 30
      rewardItemCount: 2
    hotPotato:
      durationSeconds: 15
      passCooldownTicks: 30
      explosionDamage: 6.0
      horizontalKnockback: 0.45
      verticalKnockback: 1.05
      urgentSeconds: 3
    lastBreath:
      effectDurationTicks: 40
      effectPeriodTicks: 40
      effectAmplifier: 1
  itemRarity:
    legendaryPercent: 6
    rarePercent: 20
    antiRepeatHistorySize: 4

